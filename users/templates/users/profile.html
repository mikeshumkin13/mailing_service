{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h1>👤 Привет, {{ user.get_full_name|default:user.username }}!</h1>
    <p>Email: {{ user.email }}</p>

    <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        <button class="btn btn-danger mt-2" type="submit">Выйти</button>
    </form>
  </div>
{% endblock %}
