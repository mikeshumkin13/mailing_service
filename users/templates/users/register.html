{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h1>📝 Регистрация</h1>

    <form method="post" class="mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>

    <p class="mt-2">Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
  </div>
{% endblock %}
