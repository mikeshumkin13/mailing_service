{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h1>{{ form.instance.pk|yesno:"Редактировать сообщение,Создать сообщение" }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">💾 Сохранить</button>
      <a href="{% url 'user_messages:message_list' %}" class="btn btn-secondary">Назад</a>
    </form>
  </div>
{% endblock %}
